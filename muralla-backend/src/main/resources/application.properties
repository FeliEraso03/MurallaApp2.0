server.port=8081

# ── PostgreSQL Database ─────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/muralladb
spring.datasource.username=muralla
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway manages the schema; JPA only validates
spring.jpa.hibernate.ddl-auto=validate

# ── Flyway Migrations ─────────────────────────────────────────
spring.flyway.enabled=true
# baseline-on-migrate: marks existing DB state as version 0
# so Flyway only applies V1+ migrations (won't try to recreate existing tables)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ── JWT ──────────────────────────────────────────────
# Secret key (change this in production!)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ── Google OAuth2 ─────────────────────────────────────
# Replace these values with your real credentials from Google Cloud Console:
# https://console.cloud.google.com/ → APIs & Services → Credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ── CORS / Frontend ───────────────────────────────────
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# ── Logging ───────────────────────────────────────────
logging.level.org.springframework.security=INFO
