# La version tag was removed per Docker deprecation

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: muralla-db
    environment:
      POSTGRES_DB: muralladb
      POSTGRES_USER: muralla
      POSTGRES_PASSWORD: ${DB_PASSWORD:-muralla_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muralla -d muralladb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./muralla-backend
    container_name: muralla-backend
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/muralladb
      - SPRING_DATASOURCE_USERNAME=muralla
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - APP_FRONTEND_URL=http://localhost:80
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./muralla-backend/src/main/resources/data:/data # Optional for local data access

  frontend:
    build:
      context: ./muralla-frontend
    container_name: muralla-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  solver:
    build:
      context: ./muralla-solver
    container_name: muralla-solver
    ports:
      - "3000:3000"
    environment:
      - COPY_DIR=/app/copy
      - JAR_FILE=/app/WDG2PNSv2.jar
      - EXE_FILE=/app/pgraph_solver.exe
      - PORT=3000

volumes:
  pgdata:
